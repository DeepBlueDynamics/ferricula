[package]
name = "ferricula"
version = "0.9.1"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1.0"
ctrlc = "3.5"
postcard = { version = "1.1", features = ["use-std"] }
roaring = { version = "0.11", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = "0.59"
tiny_http = "0.12"
ratatui = "0.26"
crossterm = "0.27"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hex = "0.4"
rustls = "0.23"
webpki-roots = "0.26"
rmcp = { version = "0.15", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
schemars = "1.0"

[dev-dependencies]
tempfile = "3.13"
