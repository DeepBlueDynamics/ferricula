[package]
name = "ferricula"
version = "0.4.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1.0"
ctrlc = "3.5"
postcard = { version = "1.1", features = ["use-std"] }
roaring = { version = "0.11", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = "0.59"
tiny_http = "0.12"
ratatui = "0.26"
crossterm = "0.27"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hex = "0.4"
rustls = "0.23"
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3.13"
